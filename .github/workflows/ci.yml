name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一个分支连续推送时，取消还没跑完的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（pytest / ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主开发环境，Ubuntu 是常见的部署环境 —— 两边都跑，跨平台问题当场暴露
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 跑测试
        run: python -m pytest -q

  frontend:
    name: 前端构建（vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 构建
        run: npm run build

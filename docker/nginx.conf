# 单镜像里的 nginx：一个 80 端口同时提供控制台与接口。
#
#   静态文件  -> /usr/share/nginx/html（Dockerfile 里从 web 阶段拷进来的前端产物）
#   /api 等   -> 反代给**同容器内**的后端 127.0.0.1:18080（与 vite.config.ts 的 dev 代理同口径）
#
# 前端默认同源访问 /api（见 frontend/src/config/env.ts），所以这里不需要 CORS。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 头像等上传接口
    client_max_body_size 10m;

    # 接口 + 接口文档：转给本机后端
    location ~ ^/(api|docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 有些工作流节点会同步等外部接口（http 节点默认 10s 超时），留够余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 带内容哈希的产物：可以放心的长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用：刷新任意子路由都回 index.html（前端自己接管路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 索引文件不缓存，避免新版本发布后浏览器还拿着旧的入口
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

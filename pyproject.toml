[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nacho"
version = "0.1.0"
description = "机器人框架：api 层 / 核心层 / 数据库层"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
# httpx：接口层测试用它发请求（不走真实网络）
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27"]
# aiomysql：mariadb 的异步驱动（数据库层日志落库与接口层 SQLModel 共用同一套异步引擎）
mariadb = ["aiomysql>=0.2"]
# 缓存层的 Redis 后端；不装也能用（走本地内存）
redis = ["redis>=5"]
# 接口层（FastAPI 实现）；不装也不影响核心层与缓存层
# sqlmodel：表结构与查询（底层 SQLAlchemy）；aiosqlite：sqlite 的异步驱动
api = ["fastapi>=0.110", "uvicorn>=0.27", "sqlmodel>=0.0.22", "aiosqlite>=0.20"]
# OneBot 反向 WS 接入层（websockets 提供 WS 服务端）；不装也不影响核心层 / api 层
onebot = ["websockets>=13"]
# 工作流包的 http 节点用它发请求（httpx）；不装只影响 http 节点，其它节点照跑
workflow = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["nacho*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.basedpyright]
# 日志调用只关心副作用，写法与 examples/ 及 nacho/core/logger/__init__.py 的示例一致
# （裸调 log.info(...)，不写 `_ =`），关掉「调用结果未使用」的提示
reportUnusedCallResult = false
# 长消息跨行拼 f-string（f"…" f"…"）是刻意的版式，不是漏逗号：关掉免得每次都要加忽略注释
reportImplicitStringConcatenation = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

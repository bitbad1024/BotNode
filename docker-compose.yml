# 单镜像一键起（控制台 + 后端在同一个容器里）：
#
#   docker compose up -d --build            # 想改标签：docker compose build --pull
#
# 配置不用提前准备：第一次启动会照模板生成 data/config.toml（就在宿主这个目录里，直接编辑），
# 改完 docker compose restart 即生效。想自己写就先复制一份再启动：
#   cp config.toml.example data/config.toml     # Windows: copy config.toml.example data\config.toml
# （容器以 root 跑，让它生成的话那份属主是 root —— Linux 上编辑要 sudo，所以先复制更省事。）
#
# 起来之后：
#   控制台 / 接口  http://127.0.0.1:8080
#   OneBot 反向 WS  实现端连 ws://<主机>:16700/ （[onebot] 的 host/port 在 config.toml 里改）
#
# 数据库与缓存：默认 sqlite + 进程内缓存，无需额外服务；
# 要用 MariaDB / Redis，就在 config.toml 里改 [database] / [cache]，并把它们加进下面的 services。

services:
  botnode:
    build:
      context: .
      args:
        # 留空 = 前端同源访问 /api（由镜像内的 nginx 反代给后端）
        VITE_API_BASE_URL: ""
        # 国内网络可换成镜像源，例如：
        # NPM_REGISTRY: https://registry.npmmirror.com
        # PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: botnode:latest
    container_name: botnode
    restart: unless-stopped
    ports:
      - "8080:80"      # 控制台 + 接口（容器内 nginx）
      - "16700:16700"  # OneBot 反向 WS：实现端要能连进来
    volumes:
      # 运行时数据整目录挂出来：配置（data/config.toml）、sqlite（[database].path 默认
      # data/botnode.db）、Kook 密钥（data/secret_key）、上传的头像。
      #
      # 挂**目录**而不是挂单个文件：宿主上文件不存在时，挂单文件会被 Docker 建成一个同名
      # 目录，而且只读挂载下容器也写不进去（配置必须先手工准备好）。挂目录则怎么都不会错，
      # 首次启动容器还能自己把配置照模板生成出来。
      - ./data:/app/data
      # 日志分片（[logging.file].dir 默认 logs/）：只在容器里翻，用卷存着就够
      - botnode-logs:/app/logs
    environment:
      TZ: Asia/Shanghai

volumes:
  botnode-logs:

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickNeko · 控制台</title>

    <!-- 网站图标：文件放 public/ 下 —— favicon.ico -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- 无闪烁主题：React 挂载前根据本地存储 / 系统偏好确定 data-theme -->
    <script>
      ;(function () {
        var t = localStorage.getItem('tickneko.theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
